name: Release tarball

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:lib
      - run: npm pack --pack-destination "$RUNNER_TEMP"
        working-directory: dist/ngx-drag-drop
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/ngx-drag-drop-*.tgz --title "$GITHUB_REF_NAME" --notes "Angular 21 fork. Keeps customDragImageRef and the calculateDragImageOffset export."
